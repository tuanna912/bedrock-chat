<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techfest Published WebSocket Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        #chat-container { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #message-input { width: 80%; padding: 10px; }
        #send-btn { width: 18%; padding: 10px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .assistant { background: #f5f5f5; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Techfest Published WebSocket Chatbot</h1>
    
    <div id="chat-container"></div>
    <div style="display: flex;">
            <input type="text" id="message-input" placeholder="Type your message...">
    <button style="margin-left: 5px;" id="send-btn">Send</button>
    </div>


    <script>
        const WS_ENDPOINT = 'wss://xd869slbn0.execute-api.us-east-1.amazonaws.com/prod';
        const API_KEY = 'pNvbYgtJY64anPrVmceBR1RABmJuAI0y4nbTEoFi';
        const CHUNK_SIZE = 32 * 1024;
        const PostStreamingStatus = {
            START: 'START',
            BODY: 'BODY',
            END: 'END',
            STREAMING: 'STREAMING',
            STREAMING_END: 'STREAMING_END',
            CONVERSATION_METADATA: 'CONVERSATION_METADATA',
            ERROR: 'ERROR'
        };

        let currentAssistantMessage = null;
        let loadingElement = null;
        let conversationId = null;
        let lastMessageId = null;

        function showLoading() {
            const chatContainer = document.getElementById('chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<span class="loading"></span>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            loadingElement = loadingDiv;
        }

        function hideLoading() {
            if (loadingElement) {
                loadingElement.remove();
                loadingElement = null;
            }
        }

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function updateAssistantMessage(content) {
            if (!currentAssistantMessage) {
                currentAssistantMessage = addMessage('assistant', '');
            }
            currentAssistantMessage.textContent += content;
            document.getElementById('chat-container').scrollTop = 
                document.getElementById('chat-container').scrollHeight;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (!message) {
                alert('Please enter a message');
                return;
            }

            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            currentAssistantMessage = null;
            showLoading();

            // Generate message ID
            const messageId = Date.now().toString() + Math.random().toString(36).substr(2, 9);
            
            // Prepare payload
            const payload = JSON.stringify({
                conversation_id: conversationId,
                message: {
                    role: 'user',
                    content: [{ content_type: 'text', body: message }],
                    model: 'claude-v3.7-sonnet',
                    parent_message_id: lastMessageId
                },
                enable_reasoning: false
            });

            // Chunk payload
            const chunks = [];
            const chunkCount = Math.ceil(payload.length / CHUNK_SIZE);
            for (let i = 0; i < chunkCount; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, payload.length);
                chunks.push(payload.substring(start, end));
            }

            let receivedCount = 0;

            return new Promise((resolve, reject) => {
                const ws = new WebSocket(WS_ENDPOINT);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    ws.send(JSON.stringify({
                        step: PostStreamingStatus.START,
                        apiKey: API_KEY
                    }));
                };

                ws.onmessage = (event) => {
                    const data = event.data;
                    console.log('WebSocket message received:', data);

                    if (data === 'Session started.') {
                        chunks.forEach((chunk, index) => {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.BODY,
                                index: index,
                                part: chunk
                            }));
                        });
                        return;
                    }

                    if (data === 'Message part received.') {
                        receivedCount++;
                        if (receivedCount === chunks.length) {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.END,
                                apiKey: API_KEY
                            }));
                        }
                        return;
                    }

                    if (data === 'Message sent.' || data === '') {
                        return;
                    }

                    try {
                        const parsed = JSON.parse(data);
                        console.log('Parsed message:', parsed);
                        
                        if (parsed.status === PostStreamingStatus.STREAMING) {
                            hideLoading();
                            updateAssistantMessage(parsed.completion);
                        } else if (parsed.status === PostStreamingStatus.STREAMING_END) {
                            hideLoading();
                            console.log('Streaming completed');
                        } else if (parsed.status === PostStreamingStatus.CONVERSATION_METADATA) {
                            // Update conversation tracking
                            if (parsed.conversation_id) conversationId = parsed.conversation_id;
                            if (parsed.message_id) lastMessageId = parsed.message_id;
                            console.log('Conversation metadata received:', {conversationId, lastMessageId});
                            ws.close();
                        } else if (parsed.status === PostStreamingStatus.ERROR) {
                            hideLoading();
                            console.error('Error:', parsed.reason);
                            addMessage('assistant', `Error: ${parsed.reason}`);
                            ws.close();
                        }
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };

                ws.onerror = (error) => {
                    hideLoading();
                    console.error('WebSocket error:', error);
                    reject(error);
                };

                ws.onclose = () => {
                    hideLoading();
                    console.log('WebSocket closed');
                    resolve();
                };
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
