<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techfest Published WebSocket Chatbot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        #chat-container { background: white; border-radius: 8px; height: 500px; overflow-y: auto; padding: 20px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #message-input { width: calc(100% - 90px); padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        #send-btn { width: 80px; padding: 12px; background: #0073bb; color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 5px; font-weight: 500; }
        #send-btn:hover { background: #005a94; }
        .message { margin: 20px 0; display: flex; gap: 12px; }
        .message-avatar { min-width: 36px; max-width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .user .message-avatar { background: #0073bb; color: white; }
        .assistant .message-avatar { background: #f0f0f0; padding: 4px; }
        .assistant .message-avatar img { width: 100%; height: 100%; border-radius: 4px; }
        .message-content { flex: 1; }
        .user .message-content { background: #e3f2fd; padding: 12px 16px; border-radius: 8px; }
        .assistant .message-content { padding: 4px 0; }
        .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #0073bb; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Tailwind Prose styling - matching ChatMessageMarkdown */
        .prose { color: #374151; max-width: 100%; word-wrap: break-word; }
        .prose :where(p):not(:where([class~="not-prose"] *)) { margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose :where([class~="lead"]):not(:where([class~="not-prose"] *)) { color: #4b5563; font-size: 1.25em; line-height: 1.6; margin-top: 1.2em; margin-bottom: 1.2em; }
        .prose :where(a):not(:where([class~="not-prose"] *)) { color: #0073bb; text-decoration: underline; font-weight: 500; word-break: break-word; }
        .prose :where(strong):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 600; }
        .prose :where(ol):not(:where([class~="not-prose"] *)) { list-style-type: decimal; margin-top: 1.25em; margin-bottom: 1.25em; padding-left: 1.625em; }
        .prose :where(ul):not(:where([class~="not-prose"] *)) { list-style-type: disc; margin-top: 1.25em; margin-bottom: 1.25em; padding-left: 1.625em; }
        .prose :where(li):not(:where([class~="not-prose"] *)) { margin-top: 0.5em; margin-bottom: 0.5em; }
        .prose :where(ol > li):not(:where([class~="not-prose"] *)) { padding-left: 0.375em; }
        .prose :where(ul > li):not(:where([class~="not-prose"] *)) { padding-left: 0.375em; }
        .prose :where(.prose > ul > li p):not(:where([class~="not-prose"] *)) { margin-top: 0.75em; margin-bottom: 0.75em; }
        .prose :where(.prose > ol > li > *:first-child):not(:where([class~="not-prose"] *)) { margin-top: 1.25em; }
        .prose :where(.prose > ol > li > *:last-child):not(:where([class~="not-prose"] *)) { margin-bottom: 1.25em; }
        .prose :where(blockquote):not(:where([class~="not-prose"] *)) { font-weight: 500; font-style: italic; color: #111827; border-left-width: 0.25rem; border-left-color: #e5e7eb; quotes: "\201C""\201D""\2018""\2019"; margin-top: 1.6em; margin-bottom: 1.6em; padding-left: 1em; }
        .prose :where(h1):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 800; font-size: 2.25em; margin-top: 0; margin-bottom: 0.8888889em; line-height: 1.1111111; }
        .prose :where(h2):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 700; font-size: 1.5em; margin-top: 2em; margin-bottom: 1em; line-height: 1.3333333; }
        .prose :where(h3):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 600; font-size: 1.25em; margin-top: 1.6em; margin-bottom: 0.6em; line-height: 1.6; }
        .prose :where(h4):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 600; margin-top: 1.5em; margin-bottom: 0.5em; line-height: 1.5; }
        .prose :where(code):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 600; font-size: 0.875em; background-color: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; }
        .prose :where(code):not(:where([class~="not-prose"] *))::before { content: "`"; }
        .prose :where(code):not(:where([class~="not-prose"] *))::after { content: "`"; }
        .prose :where(pre):not(:where([class~="not-prose"] *)) { color: #e5e7eb; background-color: #1e1e1e; overflow-x: auto; font-weight: 400; font-size: 0.875em; line-height: 1.7142857; margin-top: 1.7142857em; margin-bottom: 1.7142857em; border-radius: 0.375rem; padding: 0.8571429em 1.1428571em; }
        .prose :where(pre code):not(:where([class~="not-prose"] *)) { background-color: transparent; border-width: 0; border-radius: 0; padding: 0; font-weight: inherit; color: inherit; font-size: inherit; font-family: inherit; line-height: inherit; }
        .prose :where(pre code):not(:where([class~="not-prose"] *))::before { content: none; }
        .prose :where(pre code):not(:where([class~="not-prose"] *))::after { content: none; }
        .prose :where(table):not(:where([class~="not-prose"] *)) { width: 100%; table-layout: auto; text-align: left; margin-top: 2em; margin-bottom: 2em; font-size: 0.875em; line-height: 1.7142857; }
        .prose :where(thead):not(:where([class~="not-prose"] *)) { border-bottom-width: 1px; border-bottom-color: #d1d5db; }
        .prose :where(thead th):not(:where([class~="not-prose"] *)) { color: #111827; font-weight: 600; vertical-align: bottom; padding-right: 0.5714286em; padding-bottom: 0.5714286em; padding-left: 0.5714286em; }
        .prose :where(tbody tr):not(:where([class~="not-prose"] *)) { border-bottom-width: 1px; border-bottom-color: #e5e7eb; }
        .prose :where(tbody td):not(:where([class~="not-prose"] *)) { vertical-align: baseline; padding: 0.5714286em; }
        .prose :where(hr):not(:where([class~="not-prose"] *)) { border-color: #e5e7eb; border-top-width: 1px; margin-top: 3em; margin-bottom: 3em; }
    </style>
</head>
<body>
    <h1>Techfest Published WebSocket Chatbot</h1>
    
    <div id="chat-container"></div>
    <div style="display: flex;">
            <input type="text" id="message-input" placeholder="Type your message...">
    <button style="margin-left: 5px;" id="send-btn">Send</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script>
        const WS_ENDPOINT = 'wss://xd869slbn0.execute-api.us-east-1.amazonaws.com/prod';
        const API_KEY = 'pNvbYgtJY64anPrVmceBR1RABmJuAI0y4nbTEoFi';
        const CHUNK_SIZE = 32 * 1024;
        const PostStreamingStatus = {
            START: 'START',
            BODY: 'BODY',
            END: 'END',
            STREAMING: 'STREAMING',
            STREAMING_END: 'STREAMING_END',
            CONVERSATION_METADATA: 'CONVERSATION_METADATA',
            ERROR: 'ERROR'
        };

        let currentAssistantMessage = null;
        let loadingElement = null;
        let conversationId = null;
        let lastMessageId = null;

        // Simple UUID generator
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function showLoading() {
            const chatContainer = document.getElementById('chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = '<span class="loading"></span>';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            loadingElement = loadingDiv;
        }

        function hideLoading() {
            if (loadingElement) {
                loadingElement.remove();
                loadingElement = null;
            }
        }

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            if (role === 'user') {
                avatar.innerHTML = '👤';
            } else {
                avatar.innerHTML = '<img src="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\'%3E%3Cpath fill=\'%23FF9900\' d=\'M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z\'/%3E%3C/svg%3E" alt="AI">';
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.className = role === 'assistant' ? 'message-content prose' : 'message-content';
            if (role === 'user') {
                contentDiv.textContent = content;
            } else {
                contentDiv.innerHTML = content;
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return contentDiv;
        }

        let accumulatedContent = '';
        function updateAssistantMessage(content) {
            if (!currentAssistantMessage) {
                currentAssistantMessage = addMessage('assistant', '');
                accumulatedContent = '';
            }
            accumulatedContent += content;
            // Remove citation patterns like [^tooluse_xxx@0] or [^xxx]
            const cleanedContent = accumulatedContent.replace(/\[\^[\w!?/+\-_~=;.,*&@#$%]+?\]/g, '');
            currentAssistantMessage.innerHTML = marked.parse(cleanedContent);
            document.getElementById('chat-container').scrollTop = 
                document.getElementById('chat-container').scrollHeight;
        }

        async function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (!message) {
                alert('Please enter a message');
                return;
            }

            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            currentAssistantMessage = null;
            showLoading();

            // Generate conversation ID on first message
            if (!conversationId) {
                conversationId = generateUUID();
                console.log('Generated new conversation ID:', conversationId);
            }

            // Generate message ID for this user message
            const userMessageId = generateUUID();
            console.log('User message ID:', userMessageId, 'Parent:', lastMessageId);
            
            // Prepare payload in camelCase format
            const payload = JSON.stringify({
                conversationId: conversationId,
                message: {
                    content: [{ body: message, contentType: 'text' }],
                    model: 'claude-v3.7-sonnet',
                    role: 'user',
                    feedback: null,
                    usedChunks: null,
                    thinkingLog: null,
                    parentMessageId: lastMessageId
                },
                botId: '01KA889SKH6DSGEFRPTNRDFWVB',
                enableReasoning: false
            });
            
            // Update lastMessageId to current user message for next iteration
            lastMessageId = userMessageId;

            // Chunk payload
            const chunks = [];
            const chunkCount = Math.ceil(payload.length / CHUNK_SIZE);
            for (let i = 0; i < chunkCount; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, payload.length);
                chunks.push(payload.substring(start, end));
            }

            let receivedCount = 0;

            return new Promise((resolve, reject) => {
                const ws = new WebSocket(WS_ENDPOINT);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    ws.send(JSON.stringify({
                        step: PostStreamingStatus.START,
                        apiKey: API_KEY
                    }));
                };

                ws.onmessage = (event) => {
                    const data = event.data;
                    console.log('WebSocket message received:', data);

                    if (data === 'Session started.') {
                        chunks.forEach((chunk, index) => {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.BODY,
                                index: index,
                                part: chunk
                            }));
                        });
                        return;
                    }

                    if (data === 'Message part received.') {
                        receivedCount++;
                        if (receivedCount === chunks.length) {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.END,
                                apiKey: API_KEY
                            }));
                        }
                        return;
                    }

                    if (data === 'Message sent.' || data === '') {
                        return;
                    }

                    try {
                        const parsed = JSON.parse(data);
                        console.log('Parsed message:', parsed);
                        
                        if (parsed.status === PostStreamingStatus.STREAMING) {
                            hideLoading();
                            updateAssistantMessage(parsed.completion);
                        } else if (parsed.status === PostStreamingStatus.STREAMING_END) {
                            hideLoading();
                            console.log('Streaming completed');
                        } else if (parsed.status === PostStreamingStatus.CONVERSATION_METADATA) {
                            // Update conversation tracking
                            if (parsed.conversation_id) conversationId = parsed.conversation_id;
                            if (parsed.message_id) lastMessageId = parsed.message_id;
                            console.log('Conversation metadata received:', {conversationId, lastMessageId});
                            ws.close();
                        } else if (parsed.status === PostStreamingStatus.ERROR) {
                            hideLoading();
                            console.error('Error:', parsed.reason);
                            addMessage('assistant', `Error: ${parsed.reason}`);
                            ws.close();
                        }
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };

                ws.onerror = (error) => {
                    hideLoading();
                    console.error('WebSocket error:', error);
                    reject(error);
                };

                ws.onclose = () => {
                    hideLoading();
                    console.log('WebSocket closed');
                    resolve();
                };
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
