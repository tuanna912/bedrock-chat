<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Published WebSocket Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        #chat-container { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #message-input { width: 80%; padding: 10px; }
        #send-btn { width: 18%; padding: 10px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .assistant { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Published WebSocket Chatbot</h1>
    
    <div>
        <input type="text" id="ws-endpoint" placeholder="wss://your-websocket-endpoint" style="width: 60%; padding: 5px;">
        <input type="text" id="api-key" placeholder="Your API Key" style="width: 35%; padding: 5px;">
    </div>
    
    <div id="chat-container"></div>
    
    <input type="text" id="message-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>

    <script>
        const CHUNK_SIZE = 32 * 1024;
        const PostStreamingStatus = {
            START: 'START',
            BODY: 'BODY',
            END: 'END',
            STREAMING: 'STREAMING',
            STREAMING_END: 'STREAMING_END',
            ERROR: 'ERROR'
        };

        let currentAssistantMessage = null;

        function addMessage(role, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function updateAssistantMessage(content) {
            if (!currentAssistantMessage) {
                currentAssistantMessage = addMessage('assistant', '');
            }
            currentAssistantMessage.textContent += content;
            document.getElementById('chat-container').scrollTop = 
                document.getElementById('chat-container').scrollHeight;
        }

        async function sendMessage() {
            const wsEndpoint = document.getElementById('ws-endpoint').value;
            const apiKey = document.getElementById('api-key').value;
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();

            if (!wsEndpoint || !apiKey || !message) {
                alert('Please fill in all fields');
                return;
            }

            // Add user message
            addMessage('user', message);
            messageInput.value = '';
            currentAssistantMessage = null;

            // Prepare payload
            const payload = JSON.stringify({
                conversationId: null,
                message: {
                    role: 'user',
                    content: [{ contentType: 'text', body: message }],
                    model: 'claude-v3.7-sonnet',
                    parentMessageId: null
                },
                enableReasoning: false
            });

            // Chunk payload
            const chunks = [];
            const chunkCount = Math.ceil(payload.length / CHUNK_SIZE);
            for (let i = 0; i < chunkCount; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, payload.length);
                chunks.push(payload.substring(start, end));
            }

            let receivedCount = 0;

            return new Promise((resolve, reject) => {
                const ws = new WebSocket(wsEndpoint);

                ws.onopen = () => {
                    console.log('WebSocket connected');
                    ws.send(JSON.stringify({
                        step: PostStreamingStatus.START,
                        apiKey: apiKey
                    }));
                };

                ws.onmessage = (event) => {
                    const data = event.data;

                    if (data === 'Session started.') {
                        chunks.forEach((chunk, index) => {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.BODY,
                                index: index,
                                part: chunk
                            }));
                        });
                        return;
                    }

                    if (data === 'Message part received.') {
                        receivedCount++;
                        if (receivedCount === chunks.length) {
                            ws.send(JSON.stringify({
                                step: PostStreamingStatus.END,
                                apiKey: apiKey
                            }));
                        }
                        return;
                    }

                    if (data === 'Message sent.' || data === '') {
                        return;
                    }

                    try {
                        const parsed = JSON.parse(data);
                        
                        if (parsed.status === PostStreamingStatus.STREAMING) {
                            updateAssistantMessage(parsed.completion);
                        } else if (parsed.status === PostStreamingStatus.STREAMING_END) {
                            console.log('Streaming completed');
                            ws.close();
                        } else if (parsed.status === PostStreamingStatus.ERROR) {
                            console.error('Error:', parsed.reason);
                            addMessage('assistant', `Error: ${parsed.reason}`);
                            ws.close();
                        }
                    } catch (e) {
                        console.error('Parse error:', e);
                    }
                };

                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    reject(error);
                };

                ws.onclose = () => {
                    console.log('WebSocket closed');
                    resolve();
                };
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
